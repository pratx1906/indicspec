name: Evaluate a new drafter
description: Propose an EAGLE variant, DFlash successor, MTP head or model-free method as a new arm
labels: [new-arm]
body:
  - type: input
    id: repo
    attributes:
      label: Checkpoint or method
      placeholder: org/name on Hugging Face, or paper / code link
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: Target model
      options: [Qwen3-4B, Qwen3-8B, other]
    validations:
      required: true
  - type: dropdown
    id: vocab
    attributes:
      label: Draft vocabulary
      options: [full target vocabulary, pruned / remapped, none (model-free), unknown]
  - type: checkboxes
    id: engines
    attributes:
      label: Engine support (if known)
      options:
        - label: vLLM
        - label: SGLang
  - type: input
    id: licence
    attributes:
      label: Licence
  - type: textarea
    id: why
    attributes:
      label: Why it matters for Indic text
      description: e.g. full vocabulary, byte-aware, multilingual training data.

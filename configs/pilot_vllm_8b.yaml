# PILOT (pilot split only): noise estimation for docs/PREREG.md thresholds. Not a reported result.
run_name: pilot_vllm_8b
engine: vllm
model: qwen3-8b
split: pilot
languages: [en, hi, ta, te, kn, ml]
tasks: [chat, qa, summarisation, translation]
arms:
  - {arm: A0}
  - {arm: A3}
  - {arm: A4}
  - {arm: A5}
concurrency: [1, 4]
repeats: 3
load_mode: closed_loop
max_tokens: 256
ignore_eos: false
max_model_len: 4096
max_prompts_per_cell: 12
temperature: 0.0
seed: 1234

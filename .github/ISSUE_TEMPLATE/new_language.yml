name: Add a language or benchmark source
description: Extend IndicSpec-Bench to a new language, script or dataset
labels: [data]
body:
  - type: input
    id: lang
    attributes:
      label: Language and script
      placeholder: e.g. Bengali (Beng, U+0980–U+09FF)
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Parallel sources
      description: Datasets with the same items as the existing languages (FLORES, XQuAD-IN, Belebele, …), with licence and gating.
    validations:
      required: true
  - type: checkboxes
    id: review
    attributes:
      label: Review
      options:
        - label: I can help a native-speaker review of prompts in this language
